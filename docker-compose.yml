services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nexora_app
    working_dir: /var/www/html
    volumes:
      - ./nexora-app:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    env_file:
      - ./nexora-app/.env
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
    command: >
      sh -lc "
        if [ ! -f vendor/autoload.php ]; then
          composer install --no-interaction --prefer-dist --optimize-autoloader;
        fi;
        php-fpm
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nexora

  nginx:
    image: nginx:1.27-alpine
    container_name: nexora_nginx
    ports:
      - "80:80"
    volumes:
      - ./nexora-app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - nexora

  db:
    image: mysql:8.0
    container_name: nexora_db
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nexora_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "8102:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - nexora

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: nexora_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-root}
    depends_on:
      - db
    networks:
      - nexora

volumes:
  db_data:
  vendor_data:
  node_modules_data:

networks:
  nexora:
    driver: bridge

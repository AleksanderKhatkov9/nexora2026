services:

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: nexora_app
    working_dir: /var/www/html
    restart: unless-stopped

    volumes:
      - ./nexora-app:/var/www/html:cached
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules

    env_file:
      - ./nexora-app/.env

    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-nexora_db}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      MAIL_MAILER: ${MAIL_MAILER:-log}

    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t 2>/dev/null || pgrep php-fpm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

    networks:
      - nexora

  nginx:
    image: nginx:1.27-alpine
    container_name: nexora_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nexora-app:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app:
        condition: service_healthy
    networks:
      - nexora

  db:
    image: mysql:8.0
    container_name: nexora_db
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nexora_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "8102:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - nexora

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: nexora_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"

    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-root}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - nexora


volumes:
  db_data:
  vendor_data:
  node_modules_data:

networks:
  nexora:
    driver: bridge

